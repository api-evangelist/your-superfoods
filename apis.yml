name: Your Super
description: Your Super (Your Superfoods, Inc.) is a direct-to-consumer plant-based
  superfoods brand founded in 2015 in Venice, California by Michael Kuech and Kristel
  de Groot. It sells functional superfood and protein mixes and bars made from five
  to six nutrient-dense whole-food ingredients that are certified organic, Non-GMO,
  glyphosate-free, and gluten-free, sold through Shopify storefronts in the US and
  Europe and via Amazon. The company raised roughly $22.5M across five rounds from
  investors including 500 Global and PowerPlant Ventures, and was acquired by The
  Healing Company in October 2022. It is a consumer e-commerce brand and publishes
  no public developer API, developer portal, or API documentation.
